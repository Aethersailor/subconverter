name: CodeQL
'on':
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
  schedule:
  - cron: 4 3 * * 1
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build_mode: none
        - language: python
          build_mode: none
        - language: go
          build_mode: manual
        - language: c-cpp
          build_mode: none
    steps:
    - name: Checkout source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Read the locked Mihomo source revision
      id: mihomo
      if: matrix.language == 'go'
      run: |
        revision="$(python3 -c 'import json; print(json.load(open(".github/source-lock.json"))["mihomo"]["tag_identity"]["commit"])')"
        printf 'revision=%s\n' "$revision" >>"$GITHUB_OUTPUT"
    - name: Checkout locked Mihomo build sources
      if: matrix.language == 'go'
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: MetaCubeX/mihomo
        ref: ${{ steps.mihomo.outputs.revision }}
        path: .codeql-mihomo
        persist-credentials: false
    - name: Set up Go
      if: matrix.language == 'go'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        cache-dependency-path: .codeql-mihomo/go.sum
        go-version: 1.26.x
    - name: Initialize CodeQL
      uses: github/codeql-action/init@f3c49fd1ef3281abc41069b3dd22807a60c963f6
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build_mode }}
        queries: security-extended
    - name: Build the project fetcher for analysis
      if: matrix.language == 'go'
      run: |
        mkdir -p .codeql-mihomo/cmd/subconverter-mihomo-fetcher
        cp mihomo-fetcher/cmd/subconverter-mihomo-fetcher/main.go .codeql-mihomo/cmd/subconverter-mihomo-fetcher/main.go
        cp /etc/ssl/certs/ca-certificates.crt .codeql-mihomo/component/ca/ca-certificates.crt
        cd .codeql-mihomo
        go build -tags with_gvisor ./cmd/subconverter-mihomo-fetcher
    - name: Analyze source
      uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6
      with:
        category: /language:${{ matrix.language }}
