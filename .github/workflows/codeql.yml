name: CodeQL
'on':
  push:
    branches:
    - '**'
  pull_request: {}
  schedule:
  - cron: 13 4 * * *
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: c-cpp
          build-mode: none
        - language: go
          build-mode: manual
        - language: python
          build-mode: none
    steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Read the locked Mihomo source revision
      id: mihomo
      if: matrix.language == 'go'
      run: |
        revision="$(python3 -c 'import json; print(json.load(open(".github/source-lock.json"))["mihomo"]["tag_identity"]["commit"])')"
        printf 'revision=%s\n' "$revision" >>"$GITHUB_OUTPUT"
    - name: Checkout locked Mihomo build sources
      if: matrix.language == 'go'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: MetaCubeX/mihomo
        ref: ${{ steps.mihomo.outputs.revision }}
        path: .codeql-mihomo
        persist-credentials: false
    - name: Set up Go
      if: matrix.language == 'go'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: 1.26.x
        cache: false
    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-and-quality
    - name: Build the project fetcher for analysis
      if: matrix.language == 'go'
      run: |
        mkdir -p .codeql-mihomo/cmd/subconverter-mihomo-fetcher
        cp mihomo-fetcher/cmd/subconverter-mihomo-fetcher/main.go .codeql-mihomo/cmd/subconverter-mihomo-fetcher/main.go
        cp /etc/ssl/certs/ca-certificates.crt .codeql-mihomo/component/ca/ca-certificates.crt
        cd .codeql-mihomo
        go build -a -tags with_gvisor ./cmd/subconverter-mihomo-fetcher
    - name: Upload CodeQL results
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      with:
        category: /language:${{ matrix.language }}
