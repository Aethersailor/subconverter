name: Build and Publish Docker Images

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit to build
        required: false
        type: string
      version:
        description: Expected application version
        required: false
        type: string
      push:
        description: Push images to registries
        required: false
        default: false
        type: boolean
      run_smoke:
        description: Build amd64 and run integration tests (always enforced before publishing)
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or commit to build
        required: false
        type: string
      push:
        description: Push images to registries
        required: true
        default: false
        type: boolean
      run_smoke:
        description: Run the outbound-header smoke test (always enforced before publishing)
        required: true
        default: true
        type: boolean
  push:
    branches: [master]
    paths-ignore:
      - README.md
      - .github/templates/README.md.tmpl
      - .github/workflows/readme.yml
      - docs/**
      - mihomo-fetcher/PROTOCOL.md
      - scripts/MIHOMO_FETCHER_PACKAGING.md
      - scripts/mihomo_conformance/README.md
      - tests/test_readme.py

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_IMAGE: aethersailor/subconverter
  GHCR_IMAGE: ghcr.io/aethersailor/subconverter

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      project_commit: ${{ steps.metadata.outputs.project_commit }}
      upstream_commit: ${{ steps.metadata.outputs.upstream_commit }}
      should_push: ${{ steps.metadata.outputs.should_push }}
      run_smoke: ${{ steps.metadata.outputs.run_smoke }}
    steps:
      - name: Checkout source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Verify current and complete source lock
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$(mktemp -d "$RUNNER_TEMP/source-lock-evidence.XXXXXX")"
          responses="$evidence_dir/responses.json"
          printf '{}\n' > "$responses"

          capture_response() {
            local path="$1"
            local response
            response="$(mktemp "$RUNNER_TEMP/source-lock-response.XXXXXX")"
            if ! python3 scripts/retry_gh_api.py -- \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$path" > "$response"; then
              rm -f "$response"
              return 1
            fi
            jq \
              --arg key "/$path" \
              --slurpfile payload "$response" \
              '. + {($key): $payload[0]}' \
              "$responses" > "$responses.next"
            mv "$responses.next" "$responses"
            rm -f "$response"
          }

          upstream_ref='repos/asdlokj1qpi233/subconverter/git/ref/heads/master'
          capture_response "$upstream_ref"
          upstream_commit="$(jq -er --arg key "/$upstream_ref" '.[$key].object.sha' "$responses")"
          capture_response "repos/asdlokj1qpi233/subconverter/git/commits/$upstream_commit"
          capture_response "repos/asdlokj1qpi233/subconverter/contents/src/version.h?ref=$upstream_commit"

          release_path='repos/MetaCubeX/mihomo/releases/latest'
          capture_response "$release_path"
          mihomo_tag="$(jq -er --arg key "/$release_path" '.[$key].tag_name' "$responses")"
          tag_ref="repos/MetaCubeX/mihomo/git/ref/tags/$mihomo_tag"
          capture_response "$tag_ref"
          object_type="$(jq -er --arg key "/$tag_ref" '.[$key].object.type' "$responses")"
          object_sha="$(jq -er --arg key "/$tag_ref" '.[$key].object.sha' "$responses")"
          for _ in {1..8}; do
            if [[ "$object_type" == commit ]]; then
              break
            fi
            if [[ "$object_type" != tag ]]; then
              echo "Mihomo release tag resolved to unsupported object type: $object_type" >&2
              exit 1
            fi
            tag_object="repos/MetaCubeX/mihomo/git/tags/$object_sha"
            capture_response "$tag_object"
            object_type="$(jq -er --arg key "/$tag_object" '.[$key].object.type' "$responses")"
            object_sha="$(jq -er --arg key "/$tag_object" '.[$key].object.sha' "$responses")"
          done
          if [[ "$object_type" != commit ]]; then
            echo 'Mihomo release tag exceeded the supported annotation depth' >&2
            exit 1
          fi
          capture_response "repos/MetaCubeX/mihomo/git/commits/$object_sha"

          python3 scripts/resolve_source_lock.py \
            --fixture-dir "$evidence_dir" \
            --output .github/source-lock.json \
            --check
          python3 - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))
          from package_mihomo_fetcher import load_and_validate_lock

          lock = load_and_validate_lock(".github/source-lock.json")
          mihomo = lock["mihomo"]
          print(
              "Verified locked Mihomo {} at {} with pair {}".format(
                  mihomo["tag"], mihomo["tag_identity"]["commit"], lock["pair_id"]
              )
          )
          PY

      - name: Resolve and verify build metadata
        id: metadata
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          INPUT_PUSH: ${{ inputs.push }}
          INPUT_SMOKE: ${{ inputs.run_smoke }}
        shell: bash
        run: |
          set -euo pipefail
          project_commit="$(git rev-parse HEAD)"
          version="$(python3 scripts/project_metadata.py version --project-commit "$project_commit")"
          upstream_commit="$(python3 -c 'import json; print(json.load(open(".github/project-metadata.json"))["upstream_commit"])')"
          python3 scripts/project_metadata.py render --check

          if [[ -n "$EXPECTED_VERSION" && "$EXPECTED_VERSION" != "$version" ]]; then
            echo "Expected version $EXPECTED_VERSION but resolved $version" >&2
            exit 1
          fi

          should_push="$INPUT_PUSH"
          run_smoke="${INPUT_SMOKE:-true}"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            should_push=true
            run_smoke=true
          fi
          if [[ "$should_push" == "true" ]]; then
            run_smoke=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "project_commit=$project_commit" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=$upstream_commit" >> "$GITHUB_OUTPUT"
          echo "should_push=$should_push" >> "$GITHUB_OUTPUT"
          echo "run_smoke=$run_smoke" >> "$GITHUB_OUTPUT"

      - name: Run Python tests
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  smoke:
    needs: prepare
    if: needs.prepare.outputs.run_smoke == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.prepare.outputs.project_commit }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build smoke image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: scripts/Dockerfile
          load: true
          push: false
          tags: local/subconverter:${{ needs.prepare.outputs.version }}
          build-args: |
            PROJECT_COMMIT=${{ needs.prepare.outputs.project_commit }}
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
            UPSTREAM_COMMIT=${{ needs.prepare.outputs.upstream_commit }}

      - name: Verify image helper and manifest pair
        env:
          IMAGE: local/subconverter:${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          inspect_container=""
          cleanup() {
            if [[ -n "$inspect_container" ]]; then
              docker rm -f "$inspect_container" >/dev/null 2>&1 || true
            fi
            rm -rf "$work"
          }
          trap cleanup EXIT

          expected_helper_path=/usr/bin/subconverter-mihomo-fetcher
          expected_manifest_path=/usr/share/subconverter/subconverter-mihomo-fetcher.manifest.json
          docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$IMAGE" \
            | grep -Fx "SUBCONVERTER_MIHOMO_FETCHER_PATH=$expected_helper_path"

          inspect_container="$(docker create "$IMAGE")"
          docker cp "$inspect_container:$expected_helper_path" "$work/helper"
          docker cp "$inspect_container:$expected_manifest_path" "$work/manifest.json"
          docker rm "$inspect_container" >/dev/null
          inspect_container=""

          python3 scripts/package_mihomo_fetcher.py install \
            --platform linux-amd64 \
            --binary "$work/helper" \
            --manifest "$work/manifest.json" \
            --destination "$work/verified/helper" \
            --manifest-destination "$work/verified/manifest.json"
          cmp "$work/helper" "$work/verified/helper"
          cmp "$work/manifest.json" "$work/verified/manifest.json"

          cp "$work/helper" "$work/tampered-helper"
          printf '\0' >> "$work/tampered-helper"
          python3 - "$work/manifest.json" "$work/tampered-manifest.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              manifest = json.load(stream)
          manifest["pair_id"] = "sha256:" + "0" * 64
          with open(sys.argv[2], "w", encoding="utf-8", newline="\n") as stream:
              json.dump(manifest, stream, ensure_ascii=True, indent=2, sort_keys=True)
              stream.write("\n")
          PY

          reject_pair() {
            local label="$1"
            local binary="$2"
            local manifest="$3"
            if python3 scripts/package_mihomo_fetcher.py install \
              --platform linux-amd64 \
              --binary "$binary" \
              --manifest "$manifest" \
              --destination "$work/rejected-$label/helper" \
              --manifest-destination "$work/rejected-$label/manifest.json"; then
              echo "Image identity verifier accepted $label" >&2
              exit 1
            fi
          }

          reject_pair missing-helper "$work/missing-helper" "$work/manifest.json"
          reject_pair missing-manifest "$work/helper" "$work/missing-manifest.json"
          reject_pair tampered-helper "$work/tampered-helper" "$work/manifest.json"
          reject_pair tampered-manifest "$work/helper" "$work/tampered-manifest.json"

      - name: Run real SubscriptionProvider outbound integration test
        env:
          IMAGE: local/subconverter:${{ needs.prepare.outputs.version }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm \
            --name subconverter-smoke \
            --add-host host.docker.internal:host-gateway \
            -p 127.0.0.1:25500:25500 \
            "$IMAGE"
          trap 'docker stop subconverter-smoke >/dev/null 2>&1 || true' EXIT
          if ! python3 scripts/test_outbound_headers.py \
            --service-url http://127.0.0.1:25500 \
            --echo-host host.docker.internal \
            --expected-version "$EXPECTED_VERSION"; then
            docker logs subconverter-smoke >&2 || true
            exit 1
          fi

  build:
    needs: [prepare, smoke]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.should_push == 'true' &&
      (needs.smoke.result == 'success' || needs.smoke.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/386
            os: ubuntu-latest
          - platform: linux/arm/v7
            os: ubuntu-24.04-arm
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    name: Image ${{ matrix.platform }}
    steps:
      - name: Prepare platform name
        id: platform
        shell: bash
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Checkout source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.prepare.outputs.project_commit }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker Hub image by digest
        id: dockerhub_image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: scripts/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            PROJECT_COMMIT=${{ needs.prepare.outputs.project_commit }}
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
            UPSTREAM_COMMIT=${{ needs.prepare.outputs.upstream_commit }}
          provenance: false
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Build and push GHCR image by digest
        id: ghcr_image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: scripts/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            PROJECT_COMMIT=${{ needs.prepare.outputs.project_commit }}
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
            UPSTREAM_COMMIT=${{ needs.prepare.outputs.upstream_commit }}
          provenance: false
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export registry digests
        env:
          DOCKERHUB_DIGEST: ${{ steps.dockerhub_image.outputs.digest }}
          GHCR_DIGEST: ${{ steps.ghcr_image.outputs.digest }}
        shell: bash
        run: |
          mkdir -p /tmp/digests/dockerhub /tmp/digests/ghcr
          touch "/tmp/digests/dockerhub/${DOCKERHUB_DIGEST#sha256:}"
          touch "/tmp/digests/ghcr/${GHCR_DIGEST#sha256:}"

      - name: Upload Docker Hub digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-dockerhub-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/dockerhub/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload GHCR digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-ghcr-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/ghcr/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.build.result == 'success' &&
      needs.prepare.outputs.should_push == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: aethersailor/subconverter
            digest_pattern: image-digest-dockerhub-*
            registry: dockerhub
          - image: ghcr.io/aethersailor/subconverter
            digest_pattern: image-digest-ghcr-*
            registry: ghcr
    name: Publish ${{ matrix.image }}
    steps:
      - name: Checkout workflow utilities
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.prepare.outputs.project_commit }}
          fetch-depth: 1

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: ${{ matrix.digest_pattern }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to Docker Hub
        if: matrix.image == 'aethersailor/subconverter'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        if: startsWith(matrix.image, 'ghcr.io/')
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        env:
          IMAGE: ${{ matrix.image }}
        working-directory: /tmp/digests
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:latest"

      - name: Remove obsolete Docker Hub tags
        if: matrix.registry == 'dockerhub'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        shell: bash
        run: >-
          python3 scripts/cleanup_container_registry.py dockerhub
          --repository aethersailor/subconverter

      - name: Remove obsolete GHCR versions
        if: matrix.registry == 'ghcr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: >-
          python3 scripts/cleanup_container_registry.py ghcr
          --repository aethersailor/subconverter
          --owner "${{ github.repository_owner }}"

  verify:
    needs: [prepare, smoke, build, merge]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify requested work completed
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          MERGE_RESULT: ${{ needs.merge.result }}
          RUN_SMOKE: ${{ needs.prepare.outputs.run_smoke }}
          SHOULD_PUSH: ${{ needs.prepare.outputs.should_push }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PREPARE_RESULT" != "success" ]]; then
            echo "Metadata preparation failed: $PREPARE_RESULT" >&2
            exit 1
          fi
          if [[ "$RUN_SMOKE" == "true" && "$SMOKE_RESULT" != "success" ]]; then
            echo "Smoke test did not succeed: $SMOKE_RESULT" >&2
            exit 1
          fi
          if [[ "$SHOULD_PUSH" == "true" ]]; then
            if [[ "$BUILD_RESULT" != "success" ]]; then
              echo "Image build did not succeed: $BUILD_RESULT" >&2
              exit 1
            fi
            if [[ "$MERGE_RESULT" != "success" ]]; then
              echo "Manifest publication did not succeed: $MERGE_RESULT" >&2
              exit 1
            fi
          fi
