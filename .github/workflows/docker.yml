name: Build and Publish Docker Images
'on':
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit to build
        required: false
        type: string
      version:
        description: Expected application version
        required: false
        type: string
      push:
        description: Push images to registries
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or commit to build
        required: false
        type: string
      push:
        description: Push images to registries
        required: true
        default: false
        type: boolean
  push:
    branches:
    - master
    paths-ignore:
    - README.md
    - .github/templates/README.md.tmpl
    - docs/**
    - mihomo-fetcher/PROTOCOL.md
    - scripts/MIHOMO_FETCHER_PACKAGING.md
permissions:
  contents: read
  packages: write
concurrency:
  group: docker-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
env:
  DOCKERHUB_IMAGE: aethersailor/subconverter
  GHCR_IMAGE: ghcr.io/aethersailor/subconverter
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      project_commit: ${{ steps.metadata.outputs.project_commit }}
      upstream_commit: ${{ steps.metadata.outputs.upstream_commit }}
      should_push: ${{ steps.metadata.outputs.should_push }}
    steps:
    - name: Checkout source
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: ${{ inputs.ref || github.sha }}
        fetch-depth: 0
    - name: Verify current and complete source lock
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        evidence_dir="$(mktemp -d "$RUNNER_TEMP/source-lock-evidence.XXXXXX")"
        responses="$evidence_dir/responses.json"
        printf '{}\n' > "$responses"

        capture_response() {
          local path="$1"
          local response
          response="$(mktemp "$RUNNER_TEMP/source-lock-response.XXXXXX")"
          if ! python3 scripts/retry_gh_api.py -- \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$path" > "$response"; then
            rm -f "$response"
            return 1
          fi
          jq \
            --arg key "/$path" \
            --slurpfile payload "$response" \
            '. + {($key): $payload[0]}' \
            "$responses" > "$responses.next"
          mv "$responses.next" "$responses"
          rm -f "$response"
        }

        upstream_ref='repos/asdlokj1qpi233/subconverter/git/ref/heads/master'
        capture_response "$upstream_ref"
        upstream_commit="$(jq -er --arg key "/$upstream_ref" '.[$key].object.sha' "$responses")"
        capture_response "repos/asdlokj1qpi233/subconverter/git/commits/$upstream_commit"
        capture_response "repos/asdlokj1qpi233/subconverter/contents/src/version.h?ref=$upstream_commit"

        release_path='repos/MetaCubeX/mihomo/releases/latest'
        capture_response "$release_path"
        mihomo_tag="$(jq -er --arg key "/$release_path" '.[$key].tag_name' "$responses")"
        tag_ref="repos/MetaCubeX/mihomo/git/ref/tags/$mihomo_tag"
        capture_response "$tag_ref"
        object_type="$(jq -er --arg key "/$tag_ref" '.[$key].object.type' "$responses")"
        object_sha="$(jq -er --arg key "/$tag_ref" '.[$key].object.sha' "$responses")"
        for _ in {1..8}; do
          if [[ "$object_type" == commit ]]; then
            break
          fi
          if [[ "$object_type" != tag ]]; then
            echo "Mihomo release tag resolved to unsupported object type: $object_type" >&2
            exit 1
          fi
          tag_object="repos/MetaCubeX/mihomo/git/tags/$object_sha"
          capture_response "$tag_object"
          object_type="$(jq -er --arg key "/$tag_object" '.[$key].object.type' "$responses")"
          object_sha="$(jq -er --arg key "/$tag_object" '.[$key].object.sha' "$responses")"
        done
        if [[ "$object_type" != commit ]]; then
          echo 'Mihomo release tag exceeded the supported annotation depth' >&2
          exit 1
        fi
        capture_response "repos/MetaCubeX/mihomo/git/commits/$object_sha"

        python3 scripts/resolve_source_lock.py \
          --fixture-dir "$evidence_dir" \
          --output .github/source-lock.json \
          --check
        python3 - <<'PY'
        import sys
        from pathlib import Path

        sys.path.insert(0, str(Path("scripts").resolve()))
        from package_mihomo_fetcher import load_and_validate_lock

        lock = load_and_validate_lock(".github/source-lock.json")
        mihomo = lock["mihomo"]
        print(
            "Verified locked Mihomo {} at {} with pair {}".format(
                mihomo["tag"], mihomo["tag_identity"]["commit"], lock["pair_id"]
            )
        )
        PY
    - name: Resolve and verify build metadata
      id: metadata
      env:
        EXPECTED_VERSION: ${{ inputs.version }}
        INPUT_PUSH: ${{ inputs.push }}
      shell: bash
      run: |
        set -euo pipefail
        project_commit="$(git rev-parse HEAD)"
        version="$(python3 scripts/project_metadata.py version --project-commit "$project_commit")"
        upstream_commit="$(python3 -c 'import json; print(json.load(open(".github/project-metadata.json"))["upstream_commit"])')"
        python3 scripts/project_metadata.py render --check

        if [[ -n "$EXPECTED_VERSION" && "$EXPECTED_VERSION" != "$version" ]]; then
          echo "Expected version $EXPECTED_VERSION but resolved $version" >&2
          exit 1
        fi

        should_push="$INPUT_PUSH"
        if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
          should_push=true
        fi

        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "project_commit=$project_commit" >> "$GITHUB_OUTPUT"
        echo "upstream_commit=$upstream_commit" >> "$GITHUB_OUTPUT"
        echo "should_push=$should_push" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.should_push == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux/amd64
          os: ubuntu-latest
        - platform: linux/386
          os: ubuntu-latest
        - platform: linux/arm/v7
          os: ubuntu-24.04-arm
        - platform: linux/arm64
          os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    name: Image ${{ matrix.platform }}
    steps:
    - name: Prepare platform name
      id: platform
      shell: bash
      run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
      env:
        PLATFORM: ${{ matrix.platform }}
    - name: Checkout source
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: ${{ needs.prepare.outputs.project_commit }}
        fetch-depth: 0
    - name: Set up QEMU
      uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
    - name: Log in to Docker Hub
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Log in to GHCR
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push Docker Hub image by digest
      id: dockerhub_image
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
      with:
        context: .
        file: scripts/Dockerfile
        platforms: ${{ matrix.platform }}
        build-args: |
          PROJECT_COMMIT=${{ needs.prepare.outputs.project_commit }}
          BUILD_VERSION=${{ needs.prepare.outputs.version }}
          UPSTREAM_COMMIT=${{ needs.prepare.outputs.upstream_commit }}
        provenance: false
        outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
    - name: Build and push GHCR image by digest
      id: ghcr_image
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
      with:
        context: .
        file: scripts/Dockerfile
        platforms: ${{ matrix.platform }}
        build-args: |
          PROJECT_COMMIT=${{ needs.prepare.outputs.project_commit }}
          BUILD_VERSION=${{ needs.prepare.outputs.version }}
          UPSTREAM_COMMIT=${{ needs.prepare.outputs.upstream_commit }}
        provenance: false
        outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
    - name: Export registry digests
      env:
        DOCKERHUB_DIGEST: ${{ steps.dockerhub_image.outputs.digest }}
        GHCR_DIGEST: ${{ steps.ghcr_image.outputs.digest }}
      shell: bash
      run: |
        mkdir -p /tmp/digests/dockerhub /tmp/digests/ghcr
        touch "/tmp/digests/dockerhub/${DOCKERHUB_DIGEST#sha256:}"
        touch "/tmp/digests/ghcr/${GHCR_DIGEST#sha256:}"
    - name: Upload Docker Hub digest
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: image-digest-dockerhub-${{ steps.platform.outputs.pair }}
        path: /tmp/digests/dockerhub/*
        if-no-files-found: error
        retention-days: 1
    - name: Upload GHCR digest
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: image-digest-ghcr-${{ steps.platform.outputs.pair }}
        path: /tmp/digests/ghcr/*
        if-no-files-found: error
        retention-days: 1
  merge:
    needs:
    - prepare
    - build
    if: always() && needs.prepare.result == 'success' && needs.build.result == 'success' && needs.prepare.outputs.should_push == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
        - image: aethersailor/subconverter
          digest_pattern: image-digest-dockerhub-*
          registry: dockerhub
        - image: ghcr.io/aethersailor/subconverter
          digest_pattern: image-digest-ghcr-*
          registry: ghcr
    name: Publish ${{ matrix.image }}
    steps:
    - name: Checkout workflow utilities
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: ${{ needs.prepare.outputs.project_commit }}
        fetch-depth: 1
    - name: Download digests
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: /tmp/digests
        pattern: ${{ matrix.digest_pattern }}
        merge-multiple: true
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
    - name: Log in to Docker Hub
      if: matrix.image == 'aethersailor/subconverter'
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Log in to GHCR
      if: startsWith(matrix.image, 'ghcr.io/')
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Create and push manifest
      env:
        IMAGE: ${{ matrix.image }}
      working-directory: /tmp/digests
      shell: bash
      run: |
        set -euo pipefail
        docker buildx imagetools create -t "$IMAGE:latest" \
          $(printf "$IMAGE@sha256:%s " *)
        docker buildx imagetools inspect "$IMAGE:latest"
    - name: Remove obsolete Docker Hub tags
      if: matrix.registry == 'dockerhub'
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      shell: bash
      run: python3 scripts/cleanup_container_registry.py dockerhub --repository aethersailor/subconverter
    - name: Remove obsolete GHCR versions
      if: matrix.registry == 'ghcr'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: python3 scripts/cleanup_container_registry.py ghcr --repository aethersailor/subconverter --owner "${{ github.repository_owner }}"
